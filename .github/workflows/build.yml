# Builds Tome for Kindle on every push to main and publishes the KPM
# repository to GitHub Pages, so `;kpm install tome` always gets the latest.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev
          python3 -m pip install pillow
      - name: Build desktop C module
        run: make -C native
      - name: Run tests
        run: luajit tests/run_tests.lua

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit zip file
          python3 -m pip install ziglang==0.13.0
      - name: Cross-compile the Kindle binary (static LuaJIT + tomecore)
        run: ZIG="python3 -m ziglang" tools/build_kindle.sh
      - name: Check the binary is a static ARM executable
        run: |
          file build/kindle/tome
          file build/kindle/tome | grep -q "ARM"
          file build/kindle/tome | grep -q "statically linked"
      - name: Package (KPM and USB zip)
        run: |
          VERSION="0.2.${{ github.run_number }}" tools/package_kpm.sh
          tools/package_kindle.sh
          cp build/tome-kindle.zip build/kpm-repo/
      - uses: actions/upload-artifact@v4
        with:
          name: tome-kindle
          path: |
            build/kpm/*.kpkg
            build/tome-kindle.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/kpm-repo

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
